<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan 03 — Beda Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#ffffff;
    --ink:#0a0a0a;
    --line:#dcdcdc;
    --muted:#8a8a8a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px 20px;
  }
  .sheet{
    width:100%;
    max-width:480px;
  }
  .meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.02em;
    color:var(--muted);
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(2.2rem, 8vw, 3rem);
    font-weight:700;
    letter-spacing:-0.03em;
    line-height:1;
    margin-bottom:28px;
  }
  .rule{
    height:1px;
    background:var(--ink);
    margin-bottom:4px;
  }
  ul{ list-style:none; }
  li{
    display:flex;
    align-items:baseline;
    gap:18px;
    padding:18px 4px;
    border-bottom:1px solid var(--line);
    transition:background 0.15s ease, color 0.15s ease, padding-left 0.15s ease;
  }
  li:last-child{ border-bottom:1px solid var(--ink); }
  li:hover{
    background:var(--ink);
    color:var(--paper);
    padding-left:12px;
  }
  li .idx{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    color:var(--muted);
    min-width:20px;
    flex-shrink:0;
    transition:color 0.15s ease;
  }
  li:hover .idx{ color:var(--paper); opacity:0.6; }
  li .name{
    font-size:1.05rem;
    font-weight:500;
    letter-spacing:-0.01em;
  }
  footer{
    margin-top:24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--muted);
    text-align:right;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="meta">
      <span>Latihan 03</span>
      <span>04 anggota</span>
    </div>
    <h1>Beda Server</h1>
    <div class="rule"></div>
    <ul>
      <li><span class="idx">01</span><span class="name">Abdur Robi Alfiam</span></li>
      <li><span class="idx">02</span><span class="name">Yamani</span></li>
      <li><span class="idx">03</span><span class="name">Edbert Leo Chandra</span></li>
      <li><span class="idx">04</span><span class="name">Alghazali</span></li>
    </ul>
    <footer>daftar anggota</footer>
  </div>
</body>
</html>
